name: truyen_audio_app
description: App nghe truyen audio da nen tang (Android/iOS/Windows/Web) - TTS Vieneu + Kokoro.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.8.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter

  # State management + routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Network / parse HTML
  dio: ^5.7.0
  html: ^0.15.4

  # Local storage (metadata cache + settings, khong dung codegen)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Audio: phat nen + playlist + session
  just_audio: ^0.9.40
  audio_service: ^0.18.12
  audio_session: ^0.1.18
  rxdart: ^0.28.0

  # UI ho tro (Material 3 la chinh, khong dung UI library ben thu 3)
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0

  # Tien ich
  crypto: ^3.0.3
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
